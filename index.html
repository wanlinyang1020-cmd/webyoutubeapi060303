<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyMirror Language Studio - MVP</title>
    <style>
        /* 1. 极简黑白高级感全局样式 */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 2. 视频与字幕的三明治容器 */
        .theater-container {
            position: relative;
            width: 800px;
            height: 450px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* 底层：YouTube 播放器 */
        #youtube-player {
            width: 100%;
            height: 100%;
            pointer-events: none; /* 拦截原生点击，完全由我们的上层控制 */
        }

        /* 中间拦截层 + 顶层交互层组合 */
        .interaction-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.7) 100%);
            cursor: pointer;
        }

        /* 🎬 顶部：宏观小情节标题导读 */
        .story-context-title {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            border-left: 3px solid #ffde4d;
            padding-left: 12px;
            max-width: 80%;
            line-height: 1.4;
        }

        /* 💬 中下部：超大定制大字字幕 */
        .subtitle-box {
            text-align: center;
            margin-bottom: 16px;
            transition: all 0.2s ease;
            min-height: 90px; /* 防止字幕切换时高度塌陷 */
        }

        .subtitle-en {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            letter-spacing: -0.5px;
        }

        /* 核心高亮词组样式 */
        .highlight-chunk {
            color: #ffde4d; /* 亮黄色 */
            text-decoration: underline;
            text-underline-offset: 6px;
        }

        .subtitle-zh {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        /* 底部控制小提示 */
        .controls-hint {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="theater-container">
        <!-- Layer 1: YouTube 官方播放器 -->
        <div id="youtube-player"></div>

        <!-- Layer 3: 你的 App 交互层（包含标题和大字幕） -->
        <div class="interaction-layer" id="interaction-layer" onclick="togglePlay()">
            <!-- 顶部小情节导读 -->
            <div class="story-context-title" id="story-title">加载中...</div>
            
            <!-- 中间超大字幕区 -->
            <div class="subtitle-box">
                <div class="subtitle-en" id="sub-en"></div>
                <div class="subtitle-zh" id="sub-zh"></div>
            </div>

            <!-- 底部操作提示 -->
            <div class="controls-hint">点击视频区域：播放 / 暂停</div>
        </div>
    </div>

    <script>
        // 1. 模拟你未来的结构化数据库（JSON格式数据）
        const storyData = {
            videoId: "dQw4w9WgXcQ", // 这里拿了一个带地道Vlog对白声音的测试视频ID
            storySegmentTitle: "故事小情节：博主在向镜头展示他的猫，并用非常地道快速的口语进行描述...",
            subtitles: [
                { startTime: 0.0, endTime: 2.0, text: "Hey everyone,", translation: "嘿，大家好，", chunk: "" },
                { startTime: 2.1, endTime: 4.5, text: "I want to show you <span class='highlight-chunk'>something pretty cool</span>.", translation: "我想给你们看个非常酷的东西。", chunk: "something pretty cool" },
                { startTime: 4.6, endTime: 7.2, text: "This is my cat chilling <span class='highlight-chunk'>right next to me</span>.", translation: "这是我的猫，现在正舒舒服服地呆在我身边呢。", chunk: "right next to me" },
                { startTime: 7.3, endTime: 11.0, text: "He loves sleeping <span class='highlight-chunk'>all day long</span>.", translation: "他这家伙就喜欢一整天都在那睡觉。", chunk: "all day long" }
            ]
        };

        let player;
        let isPlaying = false;

        // 2. 异步加载 YouTube 官方的 IFrame API 脚本
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // 3. API 脚本加载完毕后自动调用的初始化函数
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                videoId: storyData.videoId,
                playerVars: {
                    'controls': 0,          // 彻底隐藏 YouTube 官方控制栏
                    'cc_load_policy': 0,    // 关闭官方字幕
                    'rel': 0,               // 关闭推荐视频
                    'playsinline': 1,
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            // 初始化界面上的小情节标题
            document.getElementById('story-title').innerText = storyData.storySegmentTitle;
            // 启动像素级高频渲染环同步字幕
            renderLoop();
        }

        // 4. 核心技术：高频帧同步函数（每秒刷新60次以上追踪视频时间戳）
        function renderLoop() {
            if (player && typeof player.getCurrentTime === 'function') {
                const currentTime = player.getCurrentTime();
                
                // 在内存剧本中寻找匹配当前时间的字幕行
                const currentSub = storyData.subtitles.find(
                    sub => currentTime >= sub.startTime && currentTime <= sub.endTime
                );

                if (currentSub) {
                    document.getElementById('sub-en').innerHTML = currentSub.text;
                    document.getElementById('sub-zh').innerText = currentSub.translation;
                } else {
                    // 如果当前时间戳没有字幕，优雅清空
                    document.getElementById('sub-en').innerHTML = "";
                    document.getElementById('sub-zh').innerText = "";
                }
            }
            // 递归调用，死死咬住下一帧的视频画面时间
            requestAnimationFrame(renderLoop);
        }

        // 5. 控制播放与暂停的手势交互
        function togglePlay() {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
                isPlaying = false;
            } else {
                player.playVideo();
                isPlaying = true;
            }
        }
    </script>
</body>
</html>
