<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Language Acquisition App</title>
    <style>
        /* Minimalist & High-Aesthetic Design (Aman-style inspired) */
        :root {
            --bg-color: #121212;
            --text-main: #FFFFFF;
            --text-muted: #888888;
            --accent-color: #E5A93C; /* 优雅的暗金高亮色 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 顶部极简导航 */
        header {
            width: 100%;
            max-width: 800px;
            padding: 30px 20px 10px 20px;
            box-sizing: border-box;
        }
        
        .brand {
            font-size: 14px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* 视频容器外壳：完美 16:9 比例 */
        .video-wrapper {
            width: 100%;
            max-width: 800px;
            padding: 0 20px;
            box-sizing: border-box;
            margin-top: 10px;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 字幕交互区：成人沉浸式大字呈现 */
        .subtitle-section {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .context-hint {
            font-size: 14px;
            color: var(--accent-color);
            margin-bottom: 24px;
            letter-spacing: 0.05em;
            opacity: 0.9;
        }

        .chunk-display {
            font-size: 38px;      /* 足够沉浸的超大字号 */
            font-weight: 700;
            line-height: 1.4;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            transition: color 0.3s ease;
        }

        .translation-display {
            font-size: 18px;
            color: var(--text-muted);
            font-weight: 400;
            margin-top: 12px;
        }

        /* 极简辅助交互按钮 */
        .control-panel {
            margin-top: 40px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .timestamp-btn {
            background: #222222;
            color: var(--text-main);
            border: 1px solid #333333;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .timestamp-btn:hover {
            background: #333333;
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">Intensive Listening Platform</div>
    </header>

    <div class="video-wrapper">
        <div class="video-container">
            <iframe id="bilibili-player" 
                    src="//player.bilibili.com/player.html?bvid=BV1xx411c79H&page=1&high_quality=1&danmaku=0&autoplay=0" 
                    allowfullscreen="allowfullscreen" 
                    scrolling="no" 
                    frameborder="0" 
                    sandbox="allow-top-navigation allow-same-origin allow-forms allow-scripts allow-popups">
            </iframe>
        </div>
    </div>

    <div class="subtitle-section">
        <div class="context-hint">💡 真实生活场景口语感知</div>
        
        <div class="chunk-display" id="english-text">
